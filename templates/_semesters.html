{% if semesters %}
<section class="card mb-6">
  <form method="get" class="flex flex-wrap items-end gap-3">
    <label class="flex flex-col gap-2">
      <span class="meta">Semester</span>
      <select name="semester" class="input">
        {% for semester in semesters %}
        <option value="{{ semester.id }}" {{ 'selected' if semester.id == selected_semester else '' }}>
          {{ semester.name }}{{ ' — Current' if semester.current else '' }}
        </option>
        {% endfor %}
      </select>
    </label>
    <button class="btn" type="submit">View semester</button>
  </form>
  {% if historical_semester %}
  <p class="card-subtitle mt-3">Viewing a previous semester. Live monitoring follows your current semester.</p>
  {% endif %}
  {% if request.endpoint == 'dashboard' %}
  <form method="post" action="{{ url_for('sync_semesters') }}" class="mt-3">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
    <button class="btn btn-sm" type="submit">Refresh all semesters</button>
    <span class="text-sm text-text-mid">Import or update your full semester history from ULFG.</span>
  </form>
  {% endif %}
</section>
{% endif %}
